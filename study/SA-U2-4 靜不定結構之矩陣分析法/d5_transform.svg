<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar93A9BF8" markerWidth="6.66" markerHeight="5.63" refX="6.14" refY="2.82" orient="auto"><path d="M0,0 L6.40,2.82 L0,5.63 z" fill="#93A9BF"/></marker><marker id="arE8734A9" markerWidth="7.90" markerHeight="6.69" refX="7.30" refY="3.34" orient="auto"><path d="M0,0 L7.60,3.34 L0,6.69 z" fill="#E8734A"/></marker><marker id="ar4C6B8A7" markerWidth="5.82" markerHeight="4.93" refX="5.38" refY="2.46" orient="auto"><path d="M0,0 L5.60,2.46 L0,4.93 z" fill="#4C6B8A"/></marker><marker id="ar4C6B8A9" markerWidth="7.49" markerHeight="6.34" refX="6.91" refY="3.17" orient="auto"><path d="M0,0 L7.20,3.17 L0,6.34 z" fill="#4C6B8A"/></marker></defs><rect width="980" height="690" fill="#FFFFFF"/><rect x="0.00" y="0.00" width="980.00" height="4.00" rx="0" fill="#E8734A"/><text x="26.00" y="34.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="22" fill="#1B2A41" text-anchor="start" font-weight="bold">局部座標 → 整體座標：夾在兩個 [T] 中間</text><text x="26.00" y="57.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal">元素勁度在「桿自己的座標系」裡最單純；組裝一定要先轉到共同的整體座標</text><rect x="26.00" y="92.00" width="458.00" height="318.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">① 桿的局部座標 x′ 沿桿軸</text><text x="40.00" y="134.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">轉角 α 由整體 x 軸逆時針量到 x′</text><line x1="110.00" y1="318.00" x2="450.00" y2="318.00" stroke="#93A9BF" stroke-width="1.4" marker-end="url(#ar93A9BF8)"/><line x1="110.00" y1="318.00" x2="110.00" y2="168.00" stroke="#93A9BF" stroke-width="1.4" marker-end="url(#ar93A9BF8)"/><text x="456.00" y="323.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" font-weight="normal">x</text><text x="104.00" y="160.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#5C7A99" text-anchor="start" font-weight="normal">y</text><line x1="150.00" y1="318.00" x2="366.00" y2="186.00" stroke="#1B2A41" stroke-width="3.4" stroke-linecap="round"/><circle cx="150.00" cy="318.00" r="5.00" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2.0"/><text x="150.00" y="340.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">i</text><circle cx="366.00" cy="186.00" r="5.00" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2.0"/><text x="366.00" y="172.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold">j</text><line x1="150.00" y1="318.00" x2="236.00" y2="265.50" stroke="#E8734A" stroke-width="2.2" marker-end="url(#arE8734A9)"/><text x="222.00" y="244.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#E8734A" text-anchor="start" font-weight="bold">x′</text><line x1="150.00" y1="318.00" x2="107.00" y2="248.00" stroke="#E8734A" stroke-width="2.2" marker-end="url(#arE8734A9)"/><text x="90.00" y="242.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#E8734A" text-anchor="start" font-weight="bold">y′</text><path d="M 208.00,318.00 A 58.00,58.00 0 0 0 199.72,288.13" fill="none" stroke="#4C6B8A" stroke-width="1.6" marker-end="url(#ar4C6B8A7)"/><text x="216.00" y="302.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#4C6B8A" text-anchor="start" font-weight="bold" font-style="italic">α</text><text x="110.00" y="358.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#2A3F5A" text-anchor="start" font-weight="normal">c = cos α = Δx / L　　s = sin α = Δy / L</text><rect x="496.00" y="92.00" width="458.00" height="318.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="510.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">② 轉換矩陣 [T] 只是換基底</text><text x="510.00" y="134.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">平移分量要轉、轉角分量不用轉（純量）</text><text x="669.00" y="202.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c</text><text x="725.00" y="202.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">s</text><text x="781.00" y="202.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0</text><text x="669.00" y="232.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">−s</text><text x="725.00" y="232.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">c</text><text x="781.00" y="232.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0</text><text x="669.00" y="262.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0</text><text x="725.00" y="262.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0</text><rect x="754.00" y="248.00" width="54.00" height="28.00" rx="3" fill="#DFF0E4"/><text x="781.00" y="262.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1</text><path d="M 646.00,182.00 L 633.00,182.00 L 633.00,282.00 L 646.00,282.00" fill="none" stroke="#1B2A41" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 804.00,182.00 L 817.00,182.00 L 817.00,282.00 L 804.00,282.00" fill="none" stroke="#1B2A41" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="610.00" y="232.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="end" font-weight="bold" dominant-baseline="middle">[R] =</text><text x="725.00" y="294.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="bold">轉角那一列是 1 —— 轉角不隨座標系改變</text><text x="518.00" y="320.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#2A3F5A" text-anchor="start" font-weight="normal">剛架元素：[T] 是把 [R] 放兩次的 6×6 區塊對角矩陣</text><text x="518.00" y="342.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#2A3F5A" text-anchor="start" font-weight="normal">桁架元素：只取平移，退化成 2×4（每端 2 個自由度）</text><rect x="518.00" y="356.00" width="414.00" height="46.00" rx="5" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.3"/><text x="725.00" y="379.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">[k] = [T]ᵀ [k′] [T]　（整體 = 轉置 × 局部 × 轉換）</text><rect x="26.00" y="428.00" width="928.00" height="182.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="451.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">為什麼是「夾在中間」：能量不會因為換座標而改變</text><text x="40.00" y="470.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">轉換是正交的（[T]ᵀ = [T]⁻¹），所以 [k] 一定保持對稱、保持正半定</text><text x="46.00" y="506.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#2A3F5A" text-anchor="start" font-weight="normal">位移：{d′} = [T]{d}　　→　把整體位移轉進桿自己的座標</text><text x="46.00" y="534.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#2A3F5A" text-anchor="start" font-weight="normal">端力：{f′} = [k′]{d′}　→　在局部座標裡用最單純的公式算</text><text x="46.00" y="562.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#2A3F5A" text-anchor="start" font-weight="normal">回轉：{f}  = [T]ᵀ{f′}　→　再把端力轉回整體座標</text><line x1="600.00" y1="502.00" x2="600.00" y2="568.00" stroke="#4C6B8A" stroke-width="1.6" marker-end="url(#ar4C6B8A9)"/><text x="624.00" y="502.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#2A3F5A" text-anchor="start" font-weight="normal">三步合併：</text><text x="624.00" y="526.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#2A3F5A" text-anchor="start" font-weight="normal">{f} = [T]ᵀ[k′][T]{d} = [k]{d}</text><text x="624.00" y="550.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#2A3F5A" text-anchor="start" font-weight="normal">→ 這就是可以直接組裝的整體元素勁度矩陣。</text><rect x="624.00" y="560.00" width="306.00" height="40.00" rx="5" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.3"/><text x="777.00" y="580.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">應變能 ½{d}ᵀ[k]{d} 與座標系無關</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">圖解 5／11　水平梁與垂直柱是 α = 0° 與 90° 的特例 —— 柱的「軸向」就是整體的 y 方向。</text></svg>