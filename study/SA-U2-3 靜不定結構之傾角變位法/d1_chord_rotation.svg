<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar1B2A416" markerWidth="4.99" markerHeight="4.22" refX="4.61" refY="2.11" orient="auto"><path d="M0,0 L4.80,2.11 L0,4.22 z" fill="#1B2A41"/></marker><marker id="ar4C6B8A6" markerWidth="4.99" markerHeight="4.22" refX="4.61" refY="2.11" orient="auto"><path d="M0,0 L4.80,2.11 L0,4.22 z" fill="#4C6B8A"/></marker><marker id="ar4C6B8A7" markerWidth="5.82" markerHeight="4.93" refX="5.38" refY="2.46" orient="auto"><path d="M0,0 L5.60,2.46 L0,4.93 z" fill="#4C6B8A"/></marker><marker id="ar4C6B8A7s" markerWidth="5.82" markerHeight="4.93" refX="0.45" refY="2.46" orient="auto"><path d="M5.60,0 L0,2.46 L5.60,4.93 z" fill="#4C6B8A"/></marker><marker id="ar1E84496" markerWidth="4.99" markerHeight="4.22" refX="4.61" refY="2.11" orient="auto"><path d="M0,0 L4.80,2.11 L0,4.22 z" fill="#1E8449"/></marker></defs><rect width="980" height="690" fill="#FFFFFF"/><rect x="0.00" y="0.00" width="980.00" height="4.00" rx="0" fill="#E8734A"/><text x="26.00" y="34.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="22" fill="#1B2A41" text-anchor="start" font-weight="bold">彎矩只認「相對於弦」的轉角</text><text x="26.00" y="57.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal">節點轉了多少不重要，節點相對於弦轉了多少才產生曲率</text><rect x="26.00" y="92.00" width="556.00" height="424.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">桿件 AB 的三個角度</text><line x1="104.00" y1="268.00" x2="496.00" y2="268.00" stroke="#93A9BF" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 5"/><text x="504.00" y="272.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#5C7A99" text-anchor="start" font-weight="normal">原位置</text><line x1="104.00" y1="268.00" x2="496.00" y2="364.00" stroke="#4C6B8A" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="8 5"/><text x="504.00" y="368.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#4C6B8A" text-anchor="start" font-weight="bold">弦 (chord)</text><path d="M 104,268 C 222.7,328.5 364.5,384.8 496,364" fill="none" stroke="#1B2A41" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="63.01" y1="247.12" x2="169.93" y2="301.60" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="450.57" y1="371.20" x2="569.09" y2="352.42" stroke="#E8734A" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M 160.00,268.00 A 56.00,56.00 0 0 1 153.90,293.42" fill="none" stroke="#1B2A41" stroke-width="1.4" marker-end="url(#ar1B2A416)"/><text x="170.00" y="256.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="bold" font-style="italic">θA</text><path d="M 208.00,268.00 A 104.00,104.00 0 0 1 205.01,292.74" fill="none" stroke="#4C6B8A" stroke-width="1.4" marker-end="url(#ar4C6B8A6)"/><text x="216.00" y="280.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#4C6B8A" text-anchor="start" font-weight="bold" font-style="italic">ψ</text><path d="M 244,302.3 A 140,140 0 0 1 228.7,331.6" fill="none" stroke="#E8734A" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="254.00" y="342.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#E8734A" text-anchor="start" font-weight="bold">θA − ψ</text><line x1="496.00" y1="364.00" x2="582.00" y2="364.00" stroke="#93A9BF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M 548.00,364.00 A 52.00,52.00 0 0 0 547.36,355.87" fill="none" stroke="#1B2A41" stroke-width="1.4" marker-end="url(#ar1B2A416)"/><text x="554.00" y="352.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="bold" font-style="italic">θB</text><circle cx="104.00" cy="268.00" r="5.00" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2"/><circle cx="496.00" cy="364.00" r="5.00" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2"/><text x="88.00" y="258.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="bold">A</text><text x="506.00" y="390.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="14" fill="#1B2A41" text-anchor="start" font-weight="bold">B</text><line x1="449.00" y1="268.00" x2="439.00" y2="268.00" stroke="#4C6B8A" stroke-width="0.9" stroke-linecap="round"/><line x1="449.00" y1="364.00" x2="439.00" y2="364.00" stroke="#4C6B8A" stroke-width="0.9" stroke-linecap="round"/><line x1="444.00" y1="268.00" x2="444.00" y2="364.00" stroke="#4C6B8A" stroke-width="1.0" marker-end="url(#ar4C6B8A7)" marker-start="url(#ar4C6B8A7s)"/><text x="437.00" y="316.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#4C6B8A" text-anchor="start" font-weight="normal" dominant-baseline="middle">Δ</text><rect x="42.00" y="392.00" width="524.00" height="106.00" rx="5" fill="#FDF1EC" stroke="#E8734A" stroke-width="1.1"/><rect x="42.00" y="392.00" width="4.00" height="106.00" rx="0" fill="#E8734A"/><text x="54.00" y="411.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#E8734A" text-anchor="start" font-weight="bold">只有橘色的角度會產生曲率</text><text x="54.00" y="430.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">弦轉角 ψ 只是把桿件整根抬走／放下，屬於剛體運動；</text><text x="54.00" y="447.70" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">真正讓斷面產生應變的，是切線與弦之間的夾角 (θ − ψ)。</text><text x="54.00" y="465.40" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">教科書的 −3ψ 其實就是 −2ψ − ψ：近端扣一次、遠端扣一次。</text><rect x="598.00" y="92.00" width="356.00" height="424.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="612.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">剛體檢查：沒有相對轉角就沒有彎矩</text><text x="614.00" y="144.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="start" font-weight="bold">只有 θA = 1（ψ = 0）</text><line x1="624.00" y1="188.00" x2="814.00" y2="188.00" stroke="#93A9BF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M 624,188 C 690,218 764,198 814,188" fill="none" stroke="#1B2A41" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="799.00" y1="188.00" x2="829.00" y2="188.00" stroke="#4C6B8A" stroke-width="1.6" stroke-linecap="round"/><line x1="801.14" y1="188.00" x2="795.54" y2="196.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="805.43" y1="188.00" x2="799.83" y2="196.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="809.71" y1="188.00" x2="804.11" y2="196.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="814.00" y1="188.00" x2="808.40" y2="196.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="818.29" y1="188.00" x2="812.69" y2="196.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="822.57" y1="188.00" x2="816.97" y2="196.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="826.86" y1="188.00" x2="821.26" y2="196.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><rect x="832.00" y="177.00" width="95.46" height="21.00" rx="10.5" fill="#DCE6F0"/><text x="879.73" y="188.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">單曲率　M ≠ 0</text><text x="614.00" y="266.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="start" font-weight="bold">只有 ψ = 1（θ = 0）</text><line x1="624.00" y1="310.00" x2="814.00" y2="310.00" stroke="#93A9BF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M 624,294 C 694,294 744,326 814,326" fill="none" stroke="#1B2A41" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="719.00" cy="310.00" r="4.00" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.6"/><text x="719.00" y="300.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="9.5" fill="#E8734A" text-anchor="middle" font-weight="normal">反曲點</text><rect x="832.00" y="299.00" width="95.46" height="21.00" rx="10.5" fill="#DCE6F0"/><text x="879.73" y="310.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">雙曲率　M ≠ 0</text><text x="614.00" y="388.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="start" font-weight="bold">θA = θB = ψ</text><line x1="624.00" y1="432.00" x2="814.00" y2="432.00" stroke="#93A9BF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="624.00" y1="417.00" x2="814.00" y2="447.00" stroke="#1E8449" stroke-width="3.0" stroke-linecap="round"/><path d="M 649.61,421.51 A 26.00,26.00 0 0 1 637.00,439.52" fill="none" stroke="#1E8449" stroke-width="1.4" marker-end="url(#ar1E84496)"/><rect x="832.00" y="421.00" width="128.46" height="21.00" rx="10.5" fill="#DFF0E4"/><text x="896.23" y="432.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold" dominant-baseline="middle">整根剛體旋轉　M = 0</text><rect x="26.00" y="536.00" width="928.00" height="62.00" rx="5" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.3"/><text x="490.00" y="567.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="14.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">M_AB = (2EI/L)·[ 2(θA − ψ) + (θB − ψ) ] + M F_AB     ←  與標準式 (2EI/L)(2θA + θB − 3ψ) 完全等價</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U2-3 靜不定結構之傾角變位法｜圖解由程式座標產生</text></svg>