ill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">IL 的縱座標 y(x) 的意思是：單位載重站在 x 時，那個固定斷面的反應值。所以求效應時是「載重 × 縱座標」，不是「載重 × 跨度」。</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U1-3 靜定及靜不定結構影響線｜圖解 1／11</text></svg>