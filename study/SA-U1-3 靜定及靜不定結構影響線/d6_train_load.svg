e="12.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">M_C = 80×0.6 + 40×2.4 = 144 kN·m</text><rect x="26.00" y="436.00" width="928.00" height="104.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="459.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">三種載重型態的取用方式</text><rect x="46.00" y="468.00" width="284.00" height="62.00" rx="5" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.1"/><rect x="46.00" y="468.00" width="4.00" height="62.00" rx="0" fill="#4C6B8A"/><text x="58.00" y="487.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#4C6B8A" text-anchor="start" font-weight="bold">單一集中力 P</text><text x="58.00" y="506.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">擺在峰值 → P × y_max</text><text x="58.00" y="522.80" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">100 × 2.4 = 240 kN·m</text><rect x="346.00" y="468.00" width="284.00" height="62.00" rx="5" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.1"/><rect x="346.00" y="468.00" width="4.00" height="62.00" rx="0" fill="#4C6B8A"/><text x="358.00" y="487.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#4C6B8A" text-anchor="start" font-weight="bold">可佈置均佈 w</text><text x="358.00" y="506.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">只鋪同號區 → w × 面積</text><text x="358.00" y="522.80" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">20 × 12 = 240 kN·m</text><rect x="646.00" y="468.00" width="284.00" height="62.00" rx="5" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.1"/><rect x="646.00" y="468.00" width="4.00" height="62.00" rx="0" fill="#4C6B8A"/><text x="658.00" y="487.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#4C6B8A" text-anchor="start" font-weight="bold">車隊（多軸）</text><text x="658.00" y="506.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">逐一把輪重擺到折點上試</text><text x="658.00" y="522.80" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">最大 240 kN·m（P1 壓在 C）</text><rect x="26.00" y="562.00" width="928.00" height="54.00" rx="5" fill="#1B2A41"/><text x="490.00" y="589.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">為什麼只要試折點？因為 M(位置) 是各段的線性組合，極值必落在斜率變號處，也就是影響線的折點。三個試位算完取最大即可，不必掃描。</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U1-3 靜定及靜不定結構影響線｜圖解 6／11</text></svg>