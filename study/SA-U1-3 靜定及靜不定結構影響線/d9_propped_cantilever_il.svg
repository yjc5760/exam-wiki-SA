s CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">三次式 ⇒ 曲線；靜定的一次式 ⇒ 折線。</text><rect x="500.00" y="92.00" width="454.00" height="300.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="514.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">IL  R_B（無因次，三次曲線）</text><text x="514.00" y="134.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">峰值在 B，值為 1.0</text><line x1="534.00" y1="300.62" x2="926.00" y2="300.62" stroke="#4C6B8A" stroke-width="1.4" stroke-linecap="round"/><line x1="540.00" y1="296.62" x2="540.00" y2="304.62" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="540.00" y="317.62" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">A</text><line x1="730.00" y1="296.62" x2="730.00" y2="304.62" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="730.00" y="317.62" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">L/2</text><line x1="920.00" y1="296.62" x2="920.00" y2="304.62" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="920.00" y="317.62" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">B</text><polygon points="540.00,300.62 540.00,300.62 543.17,300.60 546.33,300.57 549.50,300.51 552.67,300.43 555.83,300.32 559.00,300.20 562.17,300.05 565.33,299.87 568.50,299.68 571.67,299.46 574.83,299.22 578.00,298.96 581.17,298.68 584.33,298.38 587.50,298.06 590.67,297.71 593.83,297.35 597.00,296.97 600.17,296.56 603.33,296.14 606.50,295.69 609.67,295.23 612.83,294.74 616.00,294.24 619.17,293.72 622.33,293.