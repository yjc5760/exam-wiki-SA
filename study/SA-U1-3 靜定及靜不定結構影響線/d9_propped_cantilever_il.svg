<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690"><defs><marker id="arE8734A8" markerWidth="6.66" markerHeight="5.63" refX="6.14" refY="2.82" orient="auto"><path d="M0,0 L6.40,2.82 L0,5.63 z" fill="#E8734A"/></marker></defs><rect width="980" height="690" fill="#FFFFFF"/><rect x="0.00" y="0.00" width="980.00" height="4.00" rx="0" fill="#E8734A"/><text x="26.00" y="34.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="22" fill="#1B2A41" text-anchor="start" font-weight="bold">靜不定影響線：柔度法就是「基本結構的撓曲線除以一個常數」</text><text x="26.00" y="57.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal">A 固定 — B 滾支承，L = 6 m。IL_X(x) = δ(x, X) / δ_XX —— 分子是撓曲線方程式，分母是同一個位置的撓度。</text><rect x="26.00" y="92.00" width="462.00" height="300.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">Müller-Breslau：拿掉 B，把 B 頂高 1</text><text x="40.00" y="134.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">基本結構＝懸臂；撓曲線 δ(x) = x²(3L − x)/6EI</text><line x1="76.00" y1="212.00" x2="438.00" y2="212.00" stroke="#93A9BF" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="76.00" y1="184.00" x2="76.00" y2="240.00" stroke="#4C6B8A" stroke-width="2.0" stroke-linecap="round"/><line x1="76.00" y1="188.67" x2="67.00" y2="195.67" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="76.00" y1="198.00" x2="67.00" y2="205.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="76.00" y1="207.33" x2="67.00" y2="214.33" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="76.00" y1="216.67" x2="67.00" y2="223.67" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="76.00" y1="226.00" x2="67.00" y2="233.00" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="76.00" y1="235.33" x2="67.00" y2="242.33" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><polygon points="438.00,212.00 431.18,220.80 444.82,220.80" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-linejoin="round"/><circle cx="433.82" cy="224.00" r="3.20" fill="none" stroke="#C0392B" stroke-width="1.2"/><circle cx="442.18" cy="224.00" r="3.20" fill="none" stroke="#C0392B" stroke-width="1.2"/><line x1="421.00" y1="227.40" x2="455.00" y2="227.40" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round"/><line x1="424.40" y1="227.40" x2="419.50" y2="234.40" stroke="#C0392B" stroke-width="1.0" stroke-linecap="round"/><line x1="431.20" y1="227.40" x2="426.30" y2="234.40" stroke="#C0392B" stroke-width="1.0" stroke-linecap="round"/><line x1="438.00" y1="227.40" x2="433.10" y2="234.40" stroke="#C0392B" stroke-width="1.0" stroke-linecap="round"/><line x1="444.80" y1="227.40" x2="439.90" y2="234.40" stroke="#C0392B" stroke-width="1.0" stroke-linecap="round"/><line x1="451.60" y1="227.40" x2="446.70" y2="234.40" stroke="#C0392B" stroke-width="1.0" stroke-linecap="round"/><path d="M 76.00,212.00 L 80.07,211.99 L 84.13,211.96 L 88.20,211.91 L 92.27,211.84 L 96.34,211.76 L 100.40,211.65 L 104.47,211.53 L 108.54,211.39 L 112.61,211.23 L 116.67,211.05 L 120.74,210.86 L 124.81,210.65 L 128.88,210.42 L 132.94,210.17 L 137.01,209.91 L 141.08,209.63 L 145.15,209.34 L 149.21,209.02 L 153.28,208.70 L 157.35,208.36 L 161.42,208.00 L 165.48,207.63 L 169.55,207.24 L 173.62,206.84 L 177.69,206.42 L 181.75,205.99 L 185.82,205.55 L 189.89,205.09 L 193.96,204.62 L 198.02,204.13 L 202.09,203.64 L 206.16,203.12 L 210.22,202.60 L 214.29,202.07 L 218.36,201.52 L 222.43,200.96 L 226.49,200.39 L 230.56,199.80 L 234.63,199.21 L 238.70,198.60 L 242.76,197.99 L 246.83,197.36 L 250.90,196.72 L 254.97,196.08 L 259.03,195.42 L 263.10,194.75 L 267.1