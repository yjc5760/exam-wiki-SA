nt-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U1-3 靜定及靜不定結構影響線｜圖解 9／11</text></svg>