K TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#E8734A" text-anchor="middle" font-weight="bold">面積 = 2.25 = 3L/8</text><text x="540.00" y="352.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">全跨均佈 w 時 R_B = w × 3L/8 = 3wL/8 —— 標準答案自己掉出來。</text><text x="540.00" y="372.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">w = 24 kN/m ⇒ R_B = 54 kN（與最小功法／傾角變位法一致）</text><rect x="26.00" y="404.00" width="928.00" height="136.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="427.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">IL  M_A（A 端彎矩，單位 m）</text><text x="40.00" y="446.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">M_A(x) = ab(L + b)/2L²　—— 峰值不在跨中，也不在端點</text><line x1="90.00" y1="517.10" x2="662.00" y2="517.10" stroke="#4C6B8A" stroke-width="1.4" stroke-linecap="round"/><line x1="96.00" y1="513.10" x2="96.00" y2="521.10" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="96.00" y="534.10" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">A</text><line x1="332.68" y1="513.10" x2="332.68" y2="521.10" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="332.68" y="534.10" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">2.536</text><line x1="376.00" y1="513.10" x2="376.00" y2="521.10" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="376.00" y="534.10" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">L/2</text><line x1="656.00" y1="513.10" x2="656.00" y2="521.10" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="656.00" y="534.10" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">B</text><polygon points="96.00,517.10 96.00,517.10 100.67,515.09 105.33,513.12 110.00,511.21 114.67,509.34 119.33,507.53 124.00,505.76 128.67,504.04 133.33,502.37 138.00,500.75 142.67,499.17 147.33,497.65 152.00,496.16 156.67,494.73 161.33,493.34 166.00,491.99 170.67,490.69 175.33,489.43 180.00,488.22 184.67,487.05 189.33,485.92 194.00,484.84 198.67,483.80 203.33,482.80 208.00,481.84 212.67,480.92 217.33,480.04 222.00,479.20 226.67,478.40 231.33,477.64 236.00,476.92 240.67,476.24 245.33,475.60 250.00,474.99 254.67,474.42 259.33,473.89 264.00,473.39 268.67,472.93 273.33,472.50 278.00,472.11 282.67,471.75 287.33,471.43 292.00,471.14 296.67,470.88 301.33,470.66 306.00,470.47 310.67,470.31 315.33,470.18 320.00,470.08 324.67,470.02 329.33,469.98 334.00,469.97 338.67,470.00 343.33,470.05 348.00,470.13 352.67,470.24 357.33,470.37 362.00,470.54 366.67,470.73 371.33,470.94 376.00,471.18 380.67,471.45 385.33,471.74 390.00,472.06 394.67,472.40 399.33,472.77 404.00,473.16 408.67,473.57 413.33,474.00 418.00,474.46 422.67,474.94 427.33,475.44 432.00,475.96 436.67,476.50 441.33,477.06 446.00,477.64 450.67,478.24 455.33,478.86 460.00,479.49 464.67,480.15 469.33,480.82 474.00,481.51 478.67,482.21 483.33,482.94 488.00,483.67 492.67,484.43 497.33,485.19 502.00,485.98 506.67,486.77 511.33,487.58 516.00,488.40 520.67,489.24 525.33,490.09 530.00,490.95 534.67,491.82 539.33,492.70 544.00,493.59 548.67,494.49 553.33,495.41 558.00,496.33 562.67,497.26 567.33,498.20 572.00,499.15 576.67,500.10 581.33,501.07 586.00,502.04 590.67,503.01 595.33,503.99 600.00,504.98 604.67,505.97 609.33,506.97 614.00,507.97 618.67,508.98 623.33,509.98 628.00,510.99 632.67,512.01 637.33,513.02 642.00,514.04 6