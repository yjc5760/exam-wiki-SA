Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">本質是位移比值 δ(x)/δ_BB：EI 為常數時前後消掉。</text><text x="582.00" y="456.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">題目沒給 EI 不是漏給，是不需要。</text><rect x="26.00" y="534.00" width="928.00" height="56.00" rx="5" fill="#1B2A41"/><text x="490.00" y="562.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">同一句話兩種結果：靜定少一個束制就成為機構（剛體 → 直線），靜不定少一個束制仍然穩定（彈性 → 曲線）。看到曲線就知道這題一定是靜不定。</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U1-3 靜定及靜不定結構影響線｜圖解 3／11</text></svg>