0" height="92.00" rx="5" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.1"/><rect x="46.00" y="384.00" width="4.00" height="92.00" rx="0" fill="#4C6B8A"/><text x="58.00" y="403.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#4C6B8A" text-anchor="start" font-weight="bold">判讀</text><text x="58.00" y="422.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">直線段組成，轉折只發生在支承與內鉸處。</text><text x="58.00" y="439.25" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">與 EI 完全無關 —— 題目不給 EI 是因為用不到。</text><text x="58.00" y="456.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">定量只需要靜力平衡，不必積分。</text><line x1="550.00" y1="196.00" x2="898.00" y2="196.00" stroke="#93A9BF" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="550.00" y1="169.00" x2="550.00" y2="223.00" stroke="#4C6B8A" stroke-width="2.0" stroke-linecap="round"/><line x1="550.00" y1="173.50" x2="541.00" y2="180.50" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="550.00" y1="182.50" x2="541.00" y2="189.50" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="550.00" y1="191.50" x2="541.00" y2="198.50" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="550.00" y1="200.50" x2="541.00" y2="207.50" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="550.00" y1="209.50" x2="541.00" y2="216.50" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><line x1="550.00" y1="218.50" x2="541.00" y2="225.50" stroke="#4C6B8A" stroke-width="1.0" stroke-linecap="round"/><polygon points="898.00,196.00 891.18,204.80 904.82,204.80" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-linejoin="round"/><circle cx="893.82" cy="208.00" r="3.20" fi