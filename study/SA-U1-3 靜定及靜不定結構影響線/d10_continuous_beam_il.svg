if" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">峰值 1.0143 出現在 x = 6.697 m（B 的右側）</text><text x="652.00" y="420.80" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">因為右跨較長，撓曲線的最低點被拉過去。</text><text x="652.00" y="437.60" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">但支承 A、C 處仍然嚴格為 0。</text><rect x="640.00" y="458.00" width="314.00" height="82.00" rx="5" fill="#DFF0E4" stroke="#1F7A4D" stroke-width="1.1"/><rect x="640.00" y="458.00" width="4.00" height="82.00" rx="0" fill="#1F7A4D"/><text x="652.00" y="477.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1F7A4D" text-anchor="start" font-weight="bold">面積 → 全跨均佈的標準答案</text><text x="652.00" y="496.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">∫IL_R_B dx = 8.8958</text><text x="652.00" y="512.80" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">三彎矩法：R_B = 8.8958 w ✓ 完全相同</text><text x="652.00" y="529.60" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">全跨同號 ⇒ 兩跨都鋪滿才最不利。</text><rect x="26.00" y="560.00" width="928.00" height="56.00" rx="5" fill="#1B2A41"/><text x="490.00" y="588.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">連續梁的反力影響線全跨同號（全正），所以活載重要鋪滿兩跨才最不利；但 M_B 或跨中彎矩的影響線有正有負，就必須逐跨挑同號區佈置 —— 這是活載重佈置的分界線。</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U1-3 靜定及靜不定結構影響線｜圖解 10／11</text></svg>