8A" stroke-width="0.9" stroke-linecap="round"/><line x1="275.20" y1="199.00" x2="275.20" y2="209.00" stroke="#4C6B8A" stroke-width="0.9" stroke-linecap="round"/><line x1="72.00" y1="204.00" x2="275.20" y2="204.00" stroke="#4C6B8A" stroke-width="1.0" marker-end="url(#ar4C6B8A7)" marker-start="url(#ar4C6B8A7s)"/><text x="173.60" y="198.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#4C6B8A" text-anchor="middle" font-weight="normal">a = 4</text><line x1="275.20" y1="199.00" x2="275.20" y2="209.00" stroke="#4C6B8A" stroke-width="0.9" stroke-linecap="round"/><line x1="580.00" y1="199.00" x2="580.00" y2="209.00" stroke="#4C6B8A" stroke-width="0.9" stroke-linecap="round"/><line x1="275.20" y1="204.00" x2="580.00" y2="204.00" stroke="#4C6B8A" stroke-width="1.0" marker-end="url(#ar4C6B8A7)" marker-start="url(#ar4C6B8A7s)"/><text x="427.60" y="198.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#4C6B8A" text-anchor="middle" font-weight="normal">b = 6</text><line x1="183.76" y1="112.00" x2="183.76" y2="144.00" stroke="#E8734A" stroke-width="2.0" marker-end="url(#arE8734A8)"/><text x="183.76" y="106.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#E8734A" text-anchor="middle" font-weight="bold">P = 1</text><line x1="96.00" y1="96.00" x2="556.00" y2="96.00" stroke="#4C6B8A" stroke-width="1.2" marker-end="url(#ar4C6B8A6)"/><text x="326.00" y="90.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#4C6B8A" text-anchor="middle" font-weight="normal">載重位置 x</text><line x1="118.00" y1="291.72" x2="586.00" y2="291.72" stroke="#4C6B8A" stroke-width="1.4" stroke-linecap="round"/><line x1="124.00" y1="287.72" x2="124.00" y2="295.72" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="124.00" y="308.72" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weig