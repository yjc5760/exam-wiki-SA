" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">A</text><line x1="306.40" y1="374.62" x2="306.40" y2="382.62" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="306.40" y="395.62" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">C</text><line x1="580.00" y1="374.62" x2="580.00" y2="382.62" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="580.00" y="395.62" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">B</text><polygon points="124.00,378.62 124.00,378.62 306.40,396.29 306.40,378.62" fill="#4C6B8A22" stroke="#E8734A" stroke-width="2.0" stroke-linejoin="round"/><polygon points="306.40,378.62 306.40,352.13 580.00,378.62 580.00,378.62" fill="#E8734A22" stroke="#E8734A" stroke-width="2.0" stroke-linejoin="round"/><text x="38.00" y="375.62" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="bold">IL  V_C</text><text x="38.00" y="389.62" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="bold">（無因次）</text><line x1="306.40" y1="328.00" x2="306.40" y2="416.00" stroke="#93A9BF" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="306.40" cy="396.29" r="3.20" fill="#E8734A" stroke="#E8734A" stroke-width="1.2"/><text x="306.40" y="411.29" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#E8734A" text-anchor="middle" font-weight="bold">−0.4</text><circle cx="306.40" cy="352.13" r="3.20" fill="#E8734A" stroke="#E8734A" stroke-width="1.2"/><text x="306.40" y="344.13" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#E8734A" text-anchor="middle" font-weight="bold">+0.6</text><line x1="118.00" y1="507.82" x2="586.00" y2="507.82" stroke="#4C6B8A" stroke-width="1.4" stroke-linecap="round"/><line x1="124.00" y1="503.82" x2="124.00" y2="511.82" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="124.00" y="524.82" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">A</text><line x1="306.40" y1="503.82" x2="306.40" y2="511.82" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="306.40" y="524.82" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">C</text><line x1="580.00" y1="503.82" x2="580.00" y2="511.82" stroke="#4C6B8A" stroke-width="1.1" stroke-linecap="round"/><text x="580.00" y="524.82" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#4C6B8A" text-anchor="middle" font-weight="normal">B</text><polygon points="124.00,507.82 124.00,507.82 306.40,458.36 580.00,507.82 580.00,507.82" fill="#E8734A22" stroke="#E8734A" stroke-width="2.0" stroke-linejoin="round"/><text x="38.00" y="504.82" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="bold">IL  M_C</text><text x="38.00" y="518.82" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="bold">（單位 m）</text><line x1="306.40" y1="436.00" x2="306.40" y2="524.00" stroke="#93A9BF" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="306.40" cy="458.36" r="3.20" fill="#E8734A" stroke="#E8734A" stroke-width="1.2"/><text x="306.40" y="450.36" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#E8734A" text-anchor="middle" font-weight="bold">ab/L = 2.4 m</text><rect x="644.00" y="92.00" width="310.00" height="148.00" rx="5" fill="#FDF1EC" stroke="#E8734A" stroke-width="1.1"/><rect x="644.00" y="92.00" width="4.00" height="148.00" rx="0" fill="#E8734A"/><text x="656.00" y="111.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#E8734A" text-anchor="start" font-weight="bold">背這三個數字就夠</text><text x="656.00" y="130.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">M_C 峰值 = ab/L（峰值就在斷面處）</text><text x="656.00" y="147.70" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">　跨中最大 = L/4 = 2.5 m</text><text x="656.00" y="165.40" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">V_C 左側 = −a/L，右側 = +b/L</text><text x="656.00" y="183.10" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">　兩者絕對值相加恆等於 1</text><text x="656.00" y="200.80" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">R_A 在 A 為 1、在 B 為 0，中間直線</text><rect x="644.00" y="252.00" width="310.00" height="130.00" rx="5" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.1"/><rect x="644.00" y="252.00" width="4.00" height="130.00" rx="0" fill="#4C6B8A"/><text x="656.00" y="271.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#4C6B8A" text-anchor="start" font-weight="bold">三項自我檢查</text><text x="656.00" y="290.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">① 支承點：未移動的支承處必為 0</text><text x="656.00" y="307.70" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">② 剪力跳躍：0.6 −（−0.4）= 1.00</text><text x="656.00" y="325.40" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">③ 單位：M 的縱座標帶 m，V、R 不帶</text><rect x="644.00" y="394.00" width="310.00" height="146.00" rx="5" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.1"/><rect x="644.00" y="394.00" width="4.00" height="146.00" rx="0" fill="#4C6B8A"/><text x="656.00" y="413.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#4C6B8A" text-anchor="start" font-weight="bold">為什麼峰值在斷面處</text><text x="656.00" y="432.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">M_C 的 IL 由 Müller-Breslau：在 C 插入鉸、</text><text x="656.00" y="449.70" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">左右轉 1 rad，兩段直線的交點就在 C。</text><text x="656.00" y="467.40" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">交點高度＝兩段斜率 × 各自長度：</text><text x="656.00" y="485.10" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">　a·(b/L) = ab/L —— 公式不必死背。</text><rect x="26.00" y="562.00" width="928.00" height="54.00" rx="5" fill="#1B2A41"/><text x="490.00" y="589.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">單一集中力 P 的最大彎矩 = P × ab/L；10 m 跨、斷面在 4 m 處時 ab/L = 2.4 m，所以 P = 100 kN 給出 240 kN·m —— 影響線把「找最不利位置」變成「看峰值」。</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U1-3 靜定及靜不定結構影響線｜圖解 4／11</text></svg>