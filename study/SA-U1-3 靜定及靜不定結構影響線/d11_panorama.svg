436.00" stroke="#DFE6EE" stroke-width="1.6" marker-end="url(#arDFE6EE6)"/><circle cx="60.00" cy="468.00" r="15.00" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><text x="60.00" y="468.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">5</text><text x="86.00" y="462.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">依載重型態</text><text x="86.00" y="481.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="normal">取最大效應</text><rect x="338.00" y="92.00" width="296.00" height="448.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="352.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">三種束制的特徵</text><text x="352.00" y="134.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">認得特徵就能一眼檢查對錯</text><rect x="358.00" y="156.00" width="256.00" height="110.00" rx="5" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.1"/><rect x="358.00" y="156.00" width="4.00" height="110.00" rx="0" fill="#1B2A41"/><text x="370.00" y="175.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="start" font-weight="bold">反力 R</text><text x="370.00" y="194.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">拆法：拿掉支承，Δ = 1</text><text x="370.00" y="210.80" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.2" fill="#1B2A41" text-anchor="start" font-weight="normal">特徵：該支承處 = 1</text><text x="370.00" y="227.60" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" fo