 Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="bold">Gerber 梁 5 條</text><rect x="712.00" y="288.00" width="40.00" height="17.00" rx="8.5" fill="#DCE6F0"/><text x="732.00" y="297.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">折線</text><rect x="670.00" y="320.00" width="264.00" height="48.00" rx="5" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="1.2"/><text x="688.00" y="348.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="15" fill="#4C6B8A" text-anchor="start" font-weight="bold">④</text><text x="712.00" y="340.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="bold">桁架弦桿／斜桿</text><rect x="712.00" y="346.00" width="40.00" height="17.00" rx="8.5" fill="#DCE6F0"/><text x="732.00" y="355.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">折線</text><rect x="670.00" y="378.00" width="264.00" height="48.00" rx="5" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="688.00" y="406.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="15" fill="#E8734A" text-anchor="start" font-weight="bold">⑤</text><text x="712.00" y="398.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="bold">propped 三次曲線</text><rect x="712.00" y="404.00" width="40.00" height="17.00" rx="8.5" fill="#E8734A"/><text x="732.00" y="413.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">曲線</text><rect x="670.00" y="436.00" width="264.00" height="48.00" rx="5" fill="#FFFFFF" stroke="#DFE6EE" stroke-width="1.2"/><text x="688.00" y="464.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="15" fill="#E8734A" text-anchor="start" font-weight="bold">⑥</text><text x="712.00" y="456.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.8" fill="#1B2A41" text-anchor="start" font-weight="bold">兩跨連續梁 R_B</text><rect x="712.00" y="462.00" width="40.00" height="17.00" rx="8.5" fill="#E8734A"/><text x="732.00" y="471.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">曲線</text><text x="670.00" y="508.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#5C7A99" text-anchor="start" font-weight="normal">靜定四題全部只用靜力平衡；</text><text x="670.00" y="525.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11" fill="#5C7A99" text-anchor="start" font-weight="normal">靜不定兩題都走柔度法（IL = δ 比值）。</text><rect x="26.00" y="560.00" width="928.00" height="56.00" rx="5" fill="#1B2A41"/><text x="490.00" y="588.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">一句話收尾：影響線不是新的分析方法，而是「把斷面固定、讓載重移動」的視角切換。Müller-Breslau 負責形狀，靜力平衡負責數值，同號區與折點負責最大效應。</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U1-3 靜定及靜不定結構影響線｜圖解 11／11</text></svg>