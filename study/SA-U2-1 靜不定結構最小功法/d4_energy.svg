<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="690" fill="#FFFFFF"/><rect x="0.00" y="0.00" width="980.00" height="4.00" rx="0" fill="#E8734A"/><text x="26.00" y="34.00" font-family="Noto Serif CJK TC, Noto Serif CJK JP, serif" font-size="22" fill="#1B2A41" text-anchor="start" font-weight="bold">應變能盤點：公式裡該留哪幾項？</text><text x="26.00" y="57.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#5C7A99" text-anchor="start" font-weight="normal">四項全寫永遠是對的，但考場上只留該留的那一項 —— 題目給了什麼常數，就是在暗示你留什麼</text><rect x="26.00" y="92.00" width="291.00" height="219.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#E8734A" text-anchor="start" font-weight="bold">① 彎曲（bending）</text><rect x="40.00" y="130.00" width="263.00" height="38.00" rx="5" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.2"/><text x="171.50" y="150.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#E8734A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U = ∫ M² / 2EI  dx</text><text x="42.00" y="194.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">梁、剛架的絕對主角。</text><text x="42.00" y="214.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">只要題目給 EI 而沒給 A、G，</text><text x="42.00" y="234.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">就只留這一項。</text><text x="42.00" y="254.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">考題九成以上只需要它。</text><rect x="331.00" y="92.00" width="291.00" height="219.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="345.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1E8449" text-anchor="start" font-weight="bold">② 軸向（axial）</text><rect x="345.00" y="130.00" width="263.00" height="38.00" rx="5" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="476.50" y="150.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U = ∫ N² / 2EA  dx = Σ F²L / 2EA</text><text x="347.00" y="194.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">桁架唯一的一項（桿件只有軸力）。</text><text x="347.00" y="214.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">混合結構中與彎曲項同量級，</text><text x="347.00" y="234.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">絕對不能沿用「可忽略」的習慣。</text><text x="347.00" y="254.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">細長梁的軸向能才可以省。</text><rect x="26.00" y="325.00" width="291.00" height="219.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="40.00" y="348.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#4C6B8A" text-anchor="start" font-weight="bold">③ 剪力（shear）</text><rect x="40.00" y="363.00" width="263.00" height="38.00" rx="5" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="1.2"/><text x="171.50" y="383.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#4C6B8A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U = ∫ f_s V² / 2GA  dx</text><text x="42.00" y="427.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">細長桿佔比 &lt; 1%（見右表）。</text><text x="42.00" y="447.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">深梁、短跨、格子梁才需要。</text><text x="42.00" y="467.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">f_s：矩形 1.2、圓形 10/9。</text><rect x="331.00" y="325.00" width="291.00" height="219.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="345.00" y="348.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#B8860B" text-anchor="start" font-weight="bold">④ 扭轉（torsion）</text><rect x="345.00" y="363.00" width="263.00" height="38.00" rx="5" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.2"/><text x="476.50" y="383.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#B8860B" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U = ∫ T² / 2GJ  dx</text><text x="347.00" y="427.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">平面結構通常沒有。</text><text x="347.00" y="447.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">空間剛架、曲梁、格子梁</text><text x="347.00" y="467.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1B2A41" text-anchor="start" font-weight="normal">才會出現。</text><rect x="636.00" y="92.00" width="318.00" height="452.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="650.00" y="115.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">剪力能到底多小？</text><text x="650.00" y="134.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">懸臂梁端點載重、矩形斷面、E/G = 2.6</text><text x="650.00" y="176.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13" fill="#4C6B8A" text-anchor="start" font-weight="bold">U_剪 / U_彎 = 0.78 (h/L)²</text><rect x="650.00" y="196.00" width="290.00" height="30.00" rx="0" fill="#1B2A41"/><text x="720.00" y="211.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">斷面高 h ／ 跨度 L</text><text x="865.00" y="211.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">剪力能佔比</text><rect x="650.00" y="226.00" width="290.00" height="30.00" rx="0" fill="#F4F6F9"/><line x1="650.00" y1="256.00" x2="940.00" y2="256.00" stroke="#DFE6EE" stroke-width="0.9" stroke-linecap="round"/><text x="720.00" y="241.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1/5</text><text x="865.00" y="241.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">3.12 %</text><line x1="650.00" y1="286.00" x2="940.00" y2="286.00" stroke="#DFE6EE" stroke-width="0.9" stroke-linecap="round"/><text x="720.00" y="271.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1/8</text><text x="865.00" y="271.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1.22 %</text><rect x="650.00" y="286.00" width="290.00" height="30.00" rx="0" fill="#F4F6F9"/><line x1="650.00" y1="316.00" x2="940.00" y2="316.00" stroke="#DFE6EE" stroke-width="0.9" stroke-linecap="round"/><text x="720.00" y="301.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1/10</text><text x="865.00" y="301.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0.78 %</text><line x1="650.00" y1="346.00" x2="940.00" y2="346.00" stroke="#DFE6EE" stroke-width="0.9" stroke-linecap="round"/><text x="720.00" y="331.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1/20</text><text x="865.00" y="331.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12" fill="#1B2A41" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0.20 %</text><rect x="650.00" y="196.00" width="290.00" height="150.00" rx="0" fill="none" stroke="#DFE6EE" stroke-width="1.1"/><rect x="650.00" y="356.00" width="290.00" height="78.00" rx="5" fill="#DFF0E4" stroke="#1F7A4D" stroke-width="1.1"/><text x="664.00" y="378.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1F7A4D" text-anchor="start" font-weight="normal">細長桿（h/L ≤ 1/10）剪力能 &lt; 1%，</text><text x="664.00" y="396.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1F7A4D" text-anchor="start" font-weight="normal">題目明寫「不計軸力與剪力變形」時，</text><text x="664.00" y="414.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1F7A4D" text-anchor="start" font-weight="normal">只留彎曲項就是標準答案。</text><rect x="650.00" y="444.00" width="290.00" height="86.00" rx="5" fill="#FBE1DE" stroke="#C0392B" stroke-width="1.1"/><text x="664.00" y="466.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="normal">但混合結構（例題⑤）不一樣：</text><text x="664.00" y="484.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="normal">吊桿的軸向能佔總能量 36 %，</text><text x="664.00" y="502.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="normal">省掉它，M_A 會少算 12%。</text><rect x="26.00" y="562.00" width="928.00" height="60.00" rx="5" fill="#1B2A41"/><text x="490.00" y="592.50" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold" dominant-baseline="middle">只給 EI → 只留彎曲；只給 EA → 只留軸向；EI 與 EA 同時給 → 兩項一起寫進同一條 U。</text><line x1="26.00" y1="659.00" x2="954.00" y2="659.00" stroke="#DFE6EE" stroke-width="1.0" stroke-linecap="round"/><text x="26.00" y="676.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal" font-style="italic">SA-U2-1 靜不定結構最小功法｜圖解 4／11</text></svg>