ly="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#5C7A99" text-anchor="middle" font-weight="normal" dominant-baseline="middle">未知力數 = 可用方程式數</text><line x1="252.00" y1="190.00" x2="252.00" y2="198.00" stroke="#E8734A" stroke-width="1.6" marker-end="url(#arE8734A8)"/><rect x="87.00" y="200.00" width="330.00" height="42.00" rx="5" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="1.2"/><text x="252.00" y="214.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">ΣFx = 0、ΣFy = 0、ΣM = 0</text><text x="252.00" y="231.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#5C7A99" text-anchor="middle" font-weight="normal" dominant-baseline="middle">內鉸另加 M = 0</text><line x1="252.00" y1="244.00" x2="252.00" y2="252.00" stroke="#E8734A" stroke-width="1.6" marker-end="url(#arE8734A8)"/><rect x="87.00" y="254.00" width="330.00" height="42.00" rx="5" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="1.2"/><text x="252.00" y="268.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">反力 R</text><text x="252.00" y="285.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#5C7A99" text-anchor="middle" font-weight="normal" dominant-baseline="middle">再切自由體</text><line x1="252.00" y1="298.00" x2="252.00" y2="306.00" stroke="#E8734A" stroke-width="1.6" marker-end="url(#arE8734A8)"/><rect x="87.00" y="308.00" width="330.00" height="42.00" rx="5" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="1.2"/><text x="252.00" y="322.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">N、V、M</text><text x="252.00" y="339.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#5C7A99" text-anchor="middle" font-weight="normal" dominant-baseline="middle">完全不需要 E、I、A</text><rect x="196.00" y="356.00" width="112.00" height="21.00" rx="10.5" fill="#DFF0E4"/><text x="252.00" y="367.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#1F7A4D" text-anchor="middle" font-weight="bold" dominant-baseline="middle">與材料、斷面無關</text><rect x="502.00" y="84.00" width="452.00" height="302.00" rx="6" fill="#F4F6F9" stroke="#DFE6EE" stroke-width="1.2"/><text x="516.00" y="107.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="13.5" fill="#1B2A41" text-anchor="start" font-weight="bold">② 位移側</text><text x="516.00" y="126.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="11.5" fill="#5C7A99" text-anchor="start" font-weight="normal">變形累積的幾何後果</text><rect x="563.00" y="146.00" width="330.00" height="42.00" rx="5" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.2"/><text x="728.00" y="160.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">已解出的 N、M</text><text x="728.00" y="177.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#5C7A99" text-anchor="middle" font-weight="normal" dominant-baseline="middle">從內力側接手</text><line x1="728.00" y1="190.00" x2="728.00" y2="198.00" stroke="#E8734A" stroke-width="1.6" marker-end="url(#arE8734A8)"/><rect x="563.00" y="200.00" width="330.00" height="42.00" rx="5" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.2"/><text x="728.00" y="214.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="12.5" fill="#1B2A41" text-anchor="middle" font-weight="bold" dominant-baseline="middle">e = NL/EA、φ = M/EI</text><text x="728.00" y="231.00" font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" font-size="10.5" fill="#5C7A99" text-anchor="middle" font-weight="norm