<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="620" height="600"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="620" height="600"/></clipPath></defs><rect width="1240" height="722" fill="#FFFFFF"/><text x="620.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">虛力系統的基本結構可以任選：只要滿足靜力平衡</text><text x="620.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">真實彎矩 M 由題目給定（已含所有靜不定效應）；虛彎矩 m 不必來自同一個結構</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="620" height="600" fill="#FFFFFF"/><line x1="153.00" y1="329.90" x2="228.00" y2="200.00" stroke="#3F4A5A" stroke-width="5.4" stroke-linecap="butt" opacity="1.0"/><line x1="228.00" y1="200.00" x2="408.00" y2="200.00" stroke="#3F4A5A" stroke-width="5.4" stroke-linecap="butt" opacity="1.0"/><line x1="408.00" y1="200.00" x2="408.00" y2="500.00" stroke="#3F4A5A" stroke-width="5.4" stroke-linecap="butt" opacity="1.0"/><line x1="133.00" y1="329.90" x2="173.00" y2="329.90" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round"/><line x1="134.40" y1="329.90" x2="127.40" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="143.70" y1="329.90" x2="136.70" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="153.00" y1="329.90" x2="146.00" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="162.30" y1="329.90" x2="155.30" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="171.60" y1="329.90" x2="164.60" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="388.00" y1="500.00" x2="428.00" y2="500.00" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round"/><line x1="389.40" y1="500.00" x2="382.40" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="398.70" y1="500.00" x2="391.70" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="408.00" y1="500.00" x2="401.00" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="417.30" y1="500.00" x2="410.30" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="426.60" y1="500.00" x2="419.60" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="340.50" y1="200.00" x2="396.00" y2="200.00" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="408.00,200.00 396.00,205.52 396.00,194.48" fill="#C0392B"/><text x="375.00" y="182.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">1</text><text x="158.50" y="264.95" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">m ≠ 0</text><text x="318.00" y="230.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">m ≠ 0</text><text x="430.00" y="350.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">m ≠ 0</text><circle cx="153.00" cy="329.90" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="131.00" y="343.90" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text><circle cx="228.00" cy="200.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="214.00" y="172.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">B</text><circle cx="408.00" cy="200.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="430.00" y="186.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">C</text><circle cx="408.00" cy="500.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="432.00" y="510.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">D</text><text x="310.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">（不建議）直接拿原結構當虛力系統</text><text x="310.00" y="548.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">三根桿都有虛彎矩，且虛系統本身也是二度靜不定</text><text x="310.00" y="570.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">⇒ 必須先解一次靜不定才能求 m，計算量翻倍</text></g><g transform="translate(620,76)" clip-path="url(#sdclip1)"><rect width="620" height="600" fill="#FFFFFF"/><line x1="153.00" y1="329.90" x2="228.00" y2="200.00" stroke="#C3CAD5" stroke-width="5.0" stroke-linecap="butt" stroke-dasharray="7 6" opacity="1.0"/><line x1="228.00" y1="200.00" x2="408.00" y2="200.00" stroke="#C3CAD5" stroke-width="5.0" stroke-linecap="butt" stroke-dasharray="7 6" opacity="1.0"/><line x1="408.00" y1="200.00" x2="408.00" y2="500.00" stroke="#3F4A5A" stroke-width="5.4" stroke-linecap="butt" opacity="1.0"/><line x1="133.00" y1="329.90" x2="173.00" y2="329.90" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round"/><line x1="134.40" y1="329.90" x2="127.40" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="143.70" y1="329.90" x2="136.70" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="153.00" y1="329.90" x2="146.00" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="162.30" y1="329.90" x2="155.30" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="171.60" y1="329.90" x2="164.60" y2="337.90" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="388.00" y1="500.00" x2="428.00" y2="500.00" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round"/><line x1="389.40" y1="500.00" x2="382.40" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="398.70" y1="500.00" x2="391.70" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="408.00" y1="500.00" x2="401.00" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="417.30" y1="500.00" x2="410.30" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="426.60" y1="500.00" x2="419.60" y2="508.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="340.50" y1="200.00" x2="396.00" y2="200.00" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="408.00,200.00 396.00,205.52 396.00,194.48" fill="#C0392B"/><text x="375.00" y="182.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">1</text><line x1="393.00" y1="167.00" x2="393.00" y2="233.00" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><text x="393.00" y="151.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">在 C 切開</text><text x="158.50" y="264.95" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">m = 0</text><text x="298.00" y="230.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">m = 0</text><text x="430.00" y="350.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">m = y</text><circle cx="153.00" cy="329.90" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="131.00" y="343.90" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">A</text><circle cx="228.00" cy="200.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="214.00" y="172.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">B</text><circle cx="408.00" cy="200.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="430.00" y="186.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">C</text><circle cx="408.00" cy="500.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="432.00" y="510.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">D</text><text x="310.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">（採用）改成「固定於 D 的懸臂柱」</text><text x="310.00" y="548.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">左半段（A–B–C）無任何載重 ⇒ 虛彎矩恆為零</text><text x="310.00" y="570.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">⇒ 只需 CD 一根桿的積分，AB 的幾何完全用不到</text></g><text x="620.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">這是本題唯一的觀念：虛力系統與真實系統可以不同構。誤以為兩者必須相同，就會掉進「先解全剛架」的陷阱。</text></svg>