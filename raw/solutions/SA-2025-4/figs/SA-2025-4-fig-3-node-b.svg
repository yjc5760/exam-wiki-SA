<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="642" viewBox="0 0 1920 642"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="640" height="520"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="640" height="520"/></clipPath><clipPath id="sdclip2"><rect x="0" y="0" width="640" height="520"/></clipPath></defs><rect width="1920" height="642" fill="#FFFFFF"/><text x="960.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">節點 b 的三條平衡方程：每一條的勁度是「哪一根桿、以哪一種行為」提供的</text><text x="960.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">ab 沿 x、bc 沿 y ⇒ 同一個轉角對兩根桿分別是扭轉與彎曲，不能混用</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="628" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="245.96" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">① ΣM<tspan dy="4.65" font-size="10.54">x</tspan><tspan dy="-4.65" font-size="15.5"> 平衡（繞 x 軸）</tspan></text><text x="320.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">ab 桿沿 x ⇒ 扭轉；bc 桿垂直於 x ⇒ 彎曲</text><line x1="150.00" y1="234.00" x2="286.80" y2="280.51" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="150.00" y1="234.00" x2="234.82" y2="162.86" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="286.80" y1="280.51" x2="324.80" y2="293.43" stroke="#C3CAD5" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="234.82" y1="162.86" x2="258.38" y2="143.10" stroke="#C3CAD5" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><circle cx="150.00" cy="234.00" r="6.2" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="134.00" y="254.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">b</text><text x="330.80" y="301.43" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">→ a</text><text x="264.38" y="137.10" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">→ c</text><rect x="296" y="104" width="322" height="50" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/><text x="310.00" y="129.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">ab：扭轉　GJ/L = 2GI/L</text><rect x="296" y="166" width="322" height="50" rx="9" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="1.4"/><text x="310.00" y="191.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">bc：彎曲　4EI/L·θxb + 2EI/L·θxc</text><text x="30.00" y="368.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">θ<tspan dy="4.35" font-size="9.86">xc</tspan><tspan dy="-4.35" font-size="14.5"> = −θ</tspan><tspan dy="4.35" font-size="9.86">xb</tspan><tspan dy="-4.35" font-size="14.5">　⇒　(4−2)EI/L = 2EI/L</tspan></text><text x="30.00" y="395.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">(2GI/L + 2EI/L)·θ<tspan dy="4.35" font-size="9.86">xb</tspan><tspan dy="-4.35" font-size="14.5"> = P</tspan><tspan dy="4.35" font-size="9.86">mxb</tspan><tspan dy="-4.35" font-size="14.5"> = ωL</tspan><tspan dy="-5.80" font-size="9.86">2</tspan><tspan dy="5.80" font-size="14.5">/12</tspan></text><text x="239.92" y="476.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">θ<tspan dy="5.10" font-size="11.56">xb</tspan><tspan dy="-5.10" font-size="17"> = ωL</tspan><tspan dy="-6.80" font-size="11.56">3</tspan><tspan dy="6.80" font-size="17">/[24I(E+G)]</tspan></text><rect x="296" y="232" width="322" height="48" rx="10" fill="#FFF6F1" stroke="#F0C9B8" stroke-width="1.3"/><text x="457.00" y="256.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#9A3412" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">J = 2I</text></g><g transform="translate(640,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="628" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="245.96" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">② ΣM<tspan dy="4.65" font-size="10.54">y</tspan><tspan dy="-4.65" font-size="15.5"> 平衡（繞 y 軸）</tspan></text><text x="320.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">bc 桿沿 y ⇒ 扭轉；但 θyb = θyc ⇒ 無相對扭轉</text><line x1="150.00" y1="234.00" x2="286.80" y2="280.51" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="150.00" y1="234.00" x2="234.82" y2="162.86" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="286.80" y1="280.51" x2="324.80" y2="293.43" stroke="#C3CAD5" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="234.82" y1="162.86" x2="258.38" y2="143.10" stroke="#C3CAD5" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><circle cx="150.00" cy="234.00" r="6.2" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="134.00" y="254.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">b</text><text x="330.80" y="301.43" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">→ a</text><text x="264.38" y="137.10" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">→ c</text><rect x="296" y="104" width="322" height="50" rx="9" fill="#FFFFFF" stroke="#2E7D6F" stroke-width="1.4"/><text x="310.00" y="129.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">ab：彎曲　4EI/L·θyb − 6EI/L²·w<tspan dy="3.75" font-size="8.5">b</tspan></text><rect x="296" y="166" width="322" height="50" rx="9" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="310.00" y="191.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">bc：扭矩 = 0（θyb = θyc ⇒ 無相對扭轉）</text><text x="30.00" y="368.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">4EI/L·θ<tspan dy="4.35" font-size="9.86">yb</tspan><tspan dy="-4.35" font-size="14.5"> − 6EI/L</tspan><tspan dy="-5.80" font-size="9.86">2</tspan><tspan dy="5.80" font-size="14.5">·w</tspan><tspan dy="4.35" font-size="9.86">b</tspan><tspan dy="-4.35" font-size="14.5"> = 0</tspan></text><text x="30.00" y="395.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">⇒ θ<tspan dy="4.35" font-size="9.86">yb</tspan><tspan dy="-4.35" font-size="14.5"> = 3w</tspan><tspan dy="4.35" font-size="9.86">b</tspan><tspan dy="-4.35" font-size="14.5">/(2L)</tspan></text><text x="262.02" y="476.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">θ<tspan dy="5.10" font-size="11.56">yb</tspan><tspan dy="-5.10" font-size="17"> = ωL</tspan><tspan dy="-6.80" font-size="11.56">3</tspan><tspan dy="6.80" font-size="17">/(4EI)</tspan></text></g><g transform="translate(1280,76)" clip-path="url(#sdclip2)"><rect x="6" y="6" width="628" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="255.88" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">③ ΣF<tspan dy="4.65" font-size="10.54">z</tspan><tspan dy="-4.65" font-size="15.5"> 平衡（z 向）</tspan></text><text x="320.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">ab 桿提供剪力勁度；bc 的剪力由對稱性抵銷</text><line x1="150.00" y1="234.00" x2="286.80" y2="280.51" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="150.00" y1="234.00" x2="234.82" y2="162.86" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="286.80" y1="280.51" x2="324.80" y2="293.43" stroke="#C3CAD5" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="234.82" y1="162.86" x2="258.38" y2="143.10" stroke="#C3CAD5" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><circle cx="150.00" cy="234.00" r="6.2" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="134.00" y="254.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">b</text><text x="330.80" y="301.43" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">→ a</text><text x="264.38" y="137.10" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">→ c</text><rect x="296" y="104" width="322" height="50" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/><text x="310.00" y="129.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">ab：剪力　12EI/L³·w<tspan dy="3.75" font-size="8.5">b</tspan><tspan dy="-3.75" font-size="12.5"> − 6EI/L²·θyb</tspan></text><rect x="296" y="166" width="322" height="50" rx="9" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="310.00" y="191.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">bc：剪力由對稱性抵銷</text><text x="30.00" y="368.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">代入 θ<tspan dy="4.35" font-size="9.86">yb</tspan><tspan dy="-4.35" font-size="14.5"> = 3w</tspan><tspan dy="4.35" font-size="9.86">b</tspan><tspan dy="-4.35" font-size="14.5">/(2L)：</tspan></text><text x="30.00" y="395.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">(12 − 9)EI/L<tspan dy="-5.80" font-size="9.86">3</tspan><tspan dy="5.80" font-size="14.5">·w</tspan><tspan dy="4.35" font-size="9.86">b</tspan><tspan dy="-4.35" font-size="14.5"> = P</tspan><tspan dy="4.35" font-size="9.86">zb</tspan><tspan dy="-4.35" font-size="14.5"> = ωL/2</tspan></text><text x="265.03" y="476.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">w<tspan dy="5.10" font-size="11.56">b</tspan><tspan dy="-5.10" font-size="17"> = ωL</tspan><tspan dy="-6.80" font-size="11.56">4</tspan><tspan dy="6.80" font-size="17">/(6EI)</tspan></text></g><text x="960.0" y="620" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">兩個最常見的失分：把 J 直接寫成 J 而不換成 2I（實心圓桿），以及誤以為 bc 桿有扭轉——θyb = θyc 使它沿自身軸線的相對扭角為零。</text></svg>