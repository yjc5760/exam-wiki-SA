0.00,326.00 158.00,329.20 158.00,322.80" fill="#8A94A6"/><polygon points="580.00,326.00 572.00,322.80 572.00,329.20" fill="#8A94A6"/><text x="365.00" y="342.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L</text><text x="240.84" y="384.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">w<tspan dy="4.50" font-size="10.2">b</tspan><tspan dy="-4.50" font-size="15"> = PL</tspan><tspan dy="-6.00" font-size="10.2">3</tspan><tspan dy="6.00" font-size="15">/3EI　　θ</tspan><tspan dy="4.50" font-size="10.2">yb</tspan><tspan dy="-4.50" font-size="15"> = PL</tspan><tspan dy="-6.00" font-size="10.2">2</tspan><tspan dy="6.00" font-size="15">/2EI　　M</tspan><tspan dy="4.50" font-size="10.2">ya</tspan><tspan dy="-4.50" font-size="15"> = PL</tspan></text><text x="254.76" y="414.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">為什麼可以這樣看：θ<tspan dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13">b = θ</tspan><tspan dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13">c ⇒ bc 桿無扭轉</tspan></text><text x="380.00" y="438.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">⇒ 對 ab 桿而言，b 端只承受 ωL/2 的剪力、繞 y 的轉角完全自由</text></g><g transform="translate(760,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="748" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="380.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 兩條路徑的數字必須一模一樣</text><text x="380.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">左＝矩陣位移法（§4）　右＝懸臂梁公式（§5）</text><rect x="34" y="82" width="692" height="62" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.1"/><text x="50.00" y="102.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">節點 b 的 z 向位移</text><text x="50.00" y="126.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">w<tspan dy="4.50" font-size="10.2">b</tspan><tspan dy="-4.50" font-size="15"> = ωL</tspan><tspan dy="-6.00" font-size="10.2">4</tspan><tspan dy="6.00" font-size="15">/(6EI)</tspan></text><text x="404.00" y="114.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">＝</text><text x="436.00" y="114.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">PL<tspan dy="-6.00" font-size="10.2">3</tspan><tspan dy="6.00" font-size="15">/3EI = ωL</tspan><tspan dy="-6.00" font-size="10.2">4</tspan><tspan dy="6.00" font-size="15">/6EI</tspan></text><rect x="34" y="156" width="692" height="62" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.1"/><text x="50.00" y="176.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">節點 b 繞 y 的轉角</text><text x="50.00" y="200.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">θ<tspan dy="4.50" font-size="10.2">yb</tspan><tspan dy="-4.50" font-size="15"> = ωL</tspan><tspan dy="-6.00" font-size="10.2">3</tspan><tspan dy="6.00" font-size="15">/(4EI)</tspan></text><text x="404.00" y="188.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">＝</text><text x="436.00" y="188.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">PL<tspan dy="-6.00" font-size="10.2">2</tspan><tspan dy="6.00" font-size="15">/2EI = ωL</tspan><tspan dy="-6.00" font-size="10.2">3</tspan><tspan dy="6.00" font-size="15">/4EI</tspan></text><rect x="34" y="230" width="692" height="62" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.1"/><text x="50.00" y="250.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">a 端繞 y 的反彎矩</text><text x="50.00" y="274.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">M<tspan dy="4.50" font-size="10.2">ya</tspan><tspan dy="-4.50" font-size="15"> = ωL</tspan><tspan dy="-6.00" font-size="10.2">2</tspan><tspan dy="6.00" font-size="15">/2</tspan></text><text x="404.00" y="262.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">＝</text><text x="436.00" y="262.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">PL = ωL<tspan dy="-6.00" font-size="10.2">2</tspan><tspan dy="6.00" font-size="15">/2</tspan></text><rect x="34" y="304" width="692" height="62" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.1"/><text x="50.00" y="324.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">a 端 z 向反力</text><text x="50.00" y="348.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">R<tspan dy="4.50" font-size="10.2">za</tspan><tspan dy="-4.50" font-size="15"> = ωL/2</tspan></text><text x="404.00" y="336.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">＝</text><text x="436.00" y="336.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">P = ωL/2</text><text x="380.00" y="430.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">腳本已以 E = 2e+08、G = 7.7e+07、I = 0.00012、L = 3、ω = 12 逐條 assert</text></g><text x="760.0" y="570" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">a 端的繞 y 反彎矩 ωL²/2 恰等於懸臂梁根部彎矩 P·L —— 這個巧合不是巧合，而是「ab 桿就是一根懸臂梁」的必然結果。</text></svg>