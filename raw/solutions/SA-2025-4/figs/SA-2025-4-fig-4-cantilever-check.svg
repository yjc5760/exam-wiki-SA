<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="592" viewBox="0 0 1520 592"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="760" height="470"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="760" height="470"/></clipPath></defs><rect width="1520" height="592" fill="#FFFFFF"/><text x="760.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">用一條與矩陣完全無關的路徑，把 b 點的位移與轉角、a 端的反彎矩重算一遍</text><text x="760.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">矩陣法算完不檢核，量級錯了也看不出來；懸臂梁公式是考場上最快的驗算</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="748" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="380.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 等效懸臂梁（ab 桿的側視圖）</text><text x="380.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">a 端固定；b 端自由，承受 P = ωL/2</text><line x1="150.00" y1="220.00" x2="580.00" y2="220.00" stroke="#C3CAD5" stroke-width="3.0" stroke-linecap="butt" stroke-dasharray="7 5" opacity="1.0"/><polyline points="150.00,220.00 153.58,220.01 157.17,220.05 160.75,220.12 164.33,220.21 167.92,220.33 171.50,220.48 175.08,220.65 178.67,220.84 182.25,221.06 185.83,221.31 189.42,221.58 193.00,221.87 196.58,222.19 200.17,222.53 203.75,222.90 207.33,223.29 210.92,223.70 214.50,224.14 218.08,224.59 221.67,225.08 225.25,225.58 228.83,226.11 232.42,226.65 236.00,227.22 239.58,227.82 243.17,228.43 246.75,229.0