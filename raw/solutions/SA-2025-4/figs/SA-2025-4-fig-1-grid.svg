iddle" font-weight="700">三根桿件皆為長度 L 的實心圓桿</text><text x="698.00" y="118.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">J = I<tspan dy="4.80" font-size="10.88">x</tspan><tspan dy="-4.80" font-size="16"> + I</tspan><tspan dy="4.80" font-size="10.88">y</tspan><tspan dy="-4.80" font-size="16"> = 2I</tspan></text><text x="698.00" y="142.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">（實心圓斷面的極慣性矩）</text><text x="698.00" y="168.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">a、d 為固定端；b、c 為剛接</text><text x="698.00" y="188.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">d–a 之間沒有桿件（細虛線僅示意平面）</text><text x="500.00" y="544.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">載重在 −z 向、結構在 xy 平面 ⇒ 每個節點的三個自由度是 w（z 向位移）、θx、θy（繞 x、y 的轉角）</text><text x="500.00" y="568.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">ab 沿 x ⇒ 繞 x 的作用對它是「扭轉」、繞 y 的是「彎曲」；bc 沿 y 則相反</text></svg>