o Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">Δ<tspan dy="4.35" font-size="9.86">c</tspan><tspan dy="-4.35" font-size="14.5"> = Δ</tspan><tspan dy="4.35" font-size="9.86">d</tspan><tspan dy="-4.35" font-size="14.5"> = 23 mm（向右）</tspan></text><text x="440.00" y="878.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">把彎矩圖畫在梁的上側是最常見的錯：兩端彎矩雖為「一順一逆」，梁中點卻是往下撓的</text></svg>