.00" y="306.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">柱上任一斷面對 D 取矩，力臂為 0</text><text x="46.00" y="330.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">⇒ 全柱 M ≡ 0 ⇒ 應變能 U<tspan dy="3.75" font-size="8.5">CD</tspan><tspan dy="-3.75" font-size="12.5"> = 0</tspan></text><text x="46.00" y="354.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="400">⇒ 題目給的 2EI 完全用不到</text><circle cx="394.00" cy="145.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="416.00" y="133.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">C</text><circle cx="394.00" cy="409.00" r="5.5" fill="#3F4A5A" stroke="#FFFFFF" stroke-width="1.6"/><text x="420.00" y="397.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">D</text><text x="290.00" y="30.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">CD 柱自由體（切斷面標 N / V / M 三者）</text><text x="290.00" y="512.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">柱只受軸壓，不受彎——這是本題唯一要看穿的事</text></g><text x="580.0" y="640" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">若誤以為 CD 受彎而假設了不存在的水平反力，靜不定度、彎矩方程式與答案會全盤皆錯。</text></svg>