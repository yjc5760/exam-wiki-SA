定</text><text x="320.00" y="430.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">取水平反力 H 為第二個贅力（不可假設 H = 0）</text></g><text x="640.0" y="560" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">漏掉 H 是本題最常見的失分點：F、G 皆為鉸，桁架受載後會向外撐，必有水平反力才能平衡。</text></svg>