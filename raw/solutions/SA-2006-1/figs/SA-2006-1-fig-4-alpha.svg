iddle" font-weight="700">α = 1 時 Δ<tspan dy="3.90" font-size="8.84">J</tspan><tspan dy="-3.90" font-size="13"> = 555.7 / EA</tspan></text><text x="440.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">參數解不是「算不出來」，而是一條有上下界的曲線</text><text x="246.60" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">不論 EI/EA 為何，Δ<tspan dy="3.90" font-size="8.84">J</tspan><tspan dy="-3.90" font-size="13">·EA 必落在 341 ～ 573 之間（相差僅 1.68 倍）</tspan></text><text x="440.00" y="522.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">考場上若擅自假設「樑剛性無限大」或「桁架無限剛」，等於直接取到端點值，屬過度推論。</text></svg>