Hei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">向左 (−1, 0) 轉 90° 之後變成 (0, +1) ＝ 向上</text></g><g transform="translate(520,0)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="508" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 攤平後：載重朝上 ⇒ 標準式要變號</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">標準 ±PL/8 是為「向下」寫的；本題朝上，兩端符號整組相反</text><line x1="110.00" y1="260.00" x2="358.00" y2="260.00" stroke="#3F4A5A" stroke-width="7.0" stroke-linecap="butt" opacity="1.0"/><line x1="110.00" y1="240.00" x2="110.00" y2="280.00" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round"/><line x1="110.00" y1="241.40" x2="102.00" y2="234.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="110.00" y1="250.70" x2="102.00" y2="243.70" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="110.00" y1="260.00" x2="102.00" y2="253.00" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="110.00" y1="269.30" x2="102.00" y2="262.30" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="110.00" y1="278.60" x2="102.00" y2="271.60" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="358.00" y1="280.00" x2="358.00" y2="240.00" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round"/><line x1="358.00" y1="278.60" x2="366.00" y2="285.60" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="358.00" y1="269.30" x2="366.00" y2="276.30" stroke="#3F4A5A" stroke-width="1.8" str