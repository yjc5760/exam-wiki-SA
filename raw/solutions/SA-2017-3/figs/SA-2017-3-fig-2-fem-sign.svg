88">CD</tspan><tspan dy="6.40" font-size="16"> = −PL/8 = -30 kN·m</tspan></text><text x="115.90" y="476.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">D 為鉸 ⇒ 修正：M<tspan dy="4.35" font-size="9.86">F</tspan><tspan dy="-10.15" font-size="9.86">CD,mod</tspan><tspan dy="5.80" font-size="14.5"> = -30 − (+30)/2 = -45</tspan></text><text x="260.00" y="504.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">寫成 -30 / +30 的話，修正值會變成 +45，之後每個答案都跟著錯</text></g></svg>