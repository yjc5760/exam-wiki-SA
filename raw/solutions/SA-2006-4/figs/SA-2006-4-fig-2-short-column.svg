idth="1.2"/><text x="560.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">比值：只跟柱長有關，與外力大小無關</text><text x="560.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">同一個 Δ 之下，M ∝ 1/L²、V ∝ 1/L³</text><text x="150.00" y="118.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">柱底彎矩比　M<tspan dy="4.80" font-size="10.88">AF</tspan><tspan dy="-4.80" font-size="16"> : M</tspan><tspan dy="4.80" font-size="10.88">EL</tspan></text><text x="560.00" y="118.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="18" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">(2/3)² = 4/9</text><text x="980.00" y="118.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">12.37 : 27.84</text><text x="150.00" y="174.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">柱底剪力比　V<tspan dy="4.80" font-size="10.88">AF</tspan><tspan dy="-4.80" font-size="16"> : V</tspan><tspan dy="4.80" font-size="10.88">EL</tspan></text><text x="560.00" y="174.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="18" fill="#7C3AED" text-anchor="middle" dominant-baseline="middle" font-weight="700">(2/3)³ = 8/27</text><text x="980.00" y="174.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">8.25 : 27.84</text><text x="560.00" y="222.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">層剪力分配：2 根長柱共 16.5 kN（16.5%），3 根短柱共 83.5 kN（83.5%）</text><text x="560.00" y="252.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">單根短柱吸走 27.84 kN，是單根長柱 8.25 kN 的 3.38 倍 —— 這就是短柱效應</text><text x="560.00" y="280.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">非結構的剛性矮牆把柱的自由長度縮短，剪力破壞常由此而來，為耐震設計大忌</text></g></svg>